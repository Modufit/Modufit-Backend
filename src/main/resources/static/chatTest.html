<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket 채팅 테스트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .config-panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .config-panel h2 {
      margin-bottom: 15px;
      color: #333;
    }
    .input-group {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .input-group label {
      font-weight: 600;
      color: #555;
    }
    .input-group input {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
    }
    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 10px;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover { background: #5568d3; }
    .btn-danger {
      background: #e74c3c;
      color: white;
    }
    .btn-danger:hover { background: #c0392b; }
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .chat-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .chat-box {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .status {
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }
    .status.connected { background: #d4edda; color: #155724; }
    .status.disconnected { background: #f8d7da; color: #721c24; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }
    .message {
      margin-bottom: 15px;
      animation: slideIn 0.3s;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.mine {
      text-align: right;
    }
    .message-content {
      display: inline-block;
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
    }
    .message.mine .message-content {
      background: #667eea;
      color: white;
    }
    .message.other .message-content {
      background: white;
      color: #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .message-sender {
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .message-time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
    }
    .system-message {
      text-align: center;
      color: #888;
      font-size: 12px;
      font-style: italic;
      margin: 10px 0;
    }
    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 24px;
      font-size: 14px;
    }
    .input-area input:focus {
      outline: none;
      border-color: #667eea;
    }
    .input-area button {
      padding: 12px 30px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 600;
    }
    .input-area button:hover { background: #5568d3; }
    .input-area button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- 설정 패널 -->
  <div class="config-panel">
    <h2>⚙️ 연결 설정</h2>
    <div class="input-group">
      <label>WebSocket URL:</label>
      <input type="text" id="wsUrl" value="http://localhost:8080/ws-chat">
    </div>
    <div class="input-group">
      <label>채팅방 ID:</label>
      <input type="number" id="chatRoomId" value="1">
    </div>
    <div style="margin-top: 20px;">
      <button class="btn btn-primary" id="connectBtn">연결</button>
      <button class="btn btn-danger" id="disconnectBtn" disabled>연결 종료</button>
    </div>
  </div>

  <!-- 채팅 박스들 -->
  <div class="chat-container">
    <!-- 사용자 1 -->
    <div class="chat-box">
      <div class="chat-header">
        <h3>👤 사용자 1</h3>
        <div style="margin-top: 5px; font-size: 14px;">
          <input type="text" id="userName1" value="김철수" style="padding: 5px; border-radius: 4px; border: none; text-align: center;">
        </div>
      </div>
      <div class="status disconnected" id="status1">연결 안됨</div>
      <div class="messages" id="messages1"></div>
      <div class="input-area">
        <input type="text" id="input1" placeholder="메시지를 입력하세요..." disabled>
        <button id="send1" disabled>전송</button>
      </div>
    </div>

    <!-- 사용자 2 -->
    <div class="chat-box">
      <div class="chat-header">
        <h3>👤 사용자 2</h3>
        <div style="margin-top: 5px; font-size: 14px;">
          <input type="text" id="userName2" value="이영희" style="padding: 5px; border-radius: 4px; border: none; text-align: center;">
        </div>
      </div>
      <div class="status disconnected" id="status2">연결 안됨</div>
      <div class="messages" id="messages2"></div>
      <div class="input-area">
        <input type="text" id="input2" placeholder="메시지를 입력하세요..." disabled>
        <button id="send2" disabled>전송</button>
      </div>
    </div>
  </div>
</div>

<!-- SockJS & STOMP 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
  const users = {
    user1: {
      id: 1,
      stompClient: null,
      connected: false,
      subscription: null  // ✅ 구독 객체 저장
    },
    user2: {
      id: 2,
      stompClient: null,
      connected: false,
      subscription: null
    }
  };

  let chatRoomId = 1;

  // ✅ 초기화 시 한 번만 이벤트 등록
  function initializeEventListeners() {
    // 연결 버튼
    document.getElementById('connectBtn').addEventListener('click', () => {
      chatRoomId = parseInt(document.getElementById('chatRoomId').value);
      const wsUrl = document.getElementById('wsUrl').value;

      connectUser('user1', wsUrl);
      connectUser('user2', wsUrl);

      document.getElementById('connectBtn').disabled = true;
      document.getElementById('disconnectBtn').disabled = false;
    });

    // 연결 종료 버튼
    document.getElementById('disconnectBtn').addEventListener('click', () => {
      disconnectUser('user1');
      disconnectUser('user2');

      document.getElementById('connectBtn').disabled = false;
      document.getElementById('disconnectBtn').disabled = true;
    });

    // ✅ 각 사용자의 전송 버튼 (한 번만 등록)
    ['1', '2'].forEach(userNum => {
      const userId = `user${userNum}`;

      document.getElementById(`send${userNum}`).addEventListener('click', () => {
        sendMessageWrapper(userId, userNum);
      });

      document.getElementById(`input${userNum}`).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendMessageWrapper(userId, userNum);
        }
      });
    });
  }

  // ✅ 메시지 전송 래퍼 (연결 상태 확인)
  function sendMessageWrapper(userId, userNum) {
    const user = users[userId];
    if (!user.connected || !user.stompClient) {
      alert('먼저 연결해주세요!');
      return;
    }

    const userName = document.getElementById(`userName${userNum}`).value;
    sendMessage(user.stompClient, user.id, userName, userNum);
  }

  // 사용자 연결
  function connectUser(userId, wsUrl) {
    const user = users[userId];
    const userNum = userId === 'user1' ? '1' : '2';
    const userName = document.getElementById(`userName${userNum}`).value;

    // ✅ 기존 연결이 있으면 먼저 정리
    if (user.stompClient && user.connected) {
      console.log(`${userId} 이미 연결되어 있습니다.`);
      return;
    }

    const socket = new SockJS(wsUrl);
    user.stompClient = Stomp.over(socket);

    // ✅ 디버그 로그 비활성화 (선택사항)
    user.stompClient.debug = null;

    user.stompClient.connect({}, (frame) => {
      console.log(`${userId} Connected: ` + frame);
      user.connected = true;
      updateStatus(userNum, true);

      // ✅ 에러 큐 구독
      user.stompClient.subscribe('/user/queue/errors', (errorFrame) => {
        const errorResponse = JSON.parse(errorFrame.body);
        console.error(`${userId} 서버 에러:`, errorResponse.message);
        alert(`[${userId}] ${errorResponse.message}`);
      });

      // ✅ 채팅방 구독 (구독 객체 저장)
      user.subscription = user.stompClient.subscribe(
              `/topic/chat/room/${chatRoomId}`,
              (message) => {
                const chatMessage = JSON.parse(message.body);
                displayMessage(userNum, chatMessage, user.id);
              }
      );

      // 채팅방 입장
      enterChatRoom(user.stompClient, user.id, userName);

    }, (error) => {
      console.error(`${userId} Connection error:`, error);
      user.connected = false;
      updateStatus(userNum, false);
    });
  }

  // 사용자 연결 종료 (개선된 버전)
  function disconnectUser(userId) {
    const user = users[userId];
    const userNum = userId === 'user1' ? '1' : '2';
    const userName = document.getElementById(`userName${userNum}`).value;

    if (user.stompClient && user.connected) {
      // ✅ 퇴장 메시지 전송
      const leaveMessage = {
        type: 'LEAVE',
        chatRoomId: chatRoomId,
        senderId: user.id,
        senderName: userName
      };

      try {
        user.stompClient.send('/app/chat/leave', {}, JSON.stringify(leaveMessage));

        // ✅ 메시지 전송 후 약간의 지연을 두고 연결 종료
        setTimeout(() => {
          if (user.stompClient) {
            user.stompClient.disconnect(() => {
              console.log(`${userId} 연결이 정상적으로 종료되었습니다.`);
              user.connected = false;
              user.stompClient = null;
              updateStatus(userNum, false);
            });
          }
        }, 300); // 300ms 대기

      } catch (error) {
        console.error(`${userId} 퇴장 메시지 전송 실패:`, error);
        // 에러가 발생해도 연결은 종료
        if (user.stompClient) {
          user.stompClient.disconnect();
        }
        user.connected = false;
        user.stompClient = null;
        updateStatus(userNum, false);
      }
    }
  }

  // 입장 메시지
  function enterChatRoom(stompClient, userId, userName) {
    const enterMessage = {
      type: 'ENTER',
      chatRoomId: chatRoomId,
      senderId: userId,
      senderName: userName
    };
    stompClient.send('/app/chat/enter', {}, JSON.stringify(enterMessage));
  }

  // 메시지 전송
  function sendMessage(stompClient, userId, userName, userNum) {
    const input = document.getElementById(`input${userNum}`);
    const message = input.value.trim();

    if (message && stompClient) {
      const chatMessage = {
        type: 'TALK',
        chatRoomId: chatRoomId,
        senderId: userId,
        senderName: userName,
        message: message
      };

      stompClient.send('/app/chat/message', {}, JSON.stringify(chatMessage));
      input.value = '';
    }
  }

  // 상태 업데이트
  function updateStatus(userNum, isConnected) {
    const statusElement = document.getElementById(`status${userNum}`);
    statusElement.textContent = isConnected ? '연결됨' : '연결 안됨';
    statusElement.className = isConnected ? 'status connected' : 'status disconnected';

    // ✅ 입력 필드 활성화/비활성화
    document.getElementById(`input${userNum}`).disabled = !isConnected;
    document.getElementById(`send${userNum}`).disabled = !isConnected;
  }

  // ✅ 페이지 로드 시 초기화
  document.addEventListener('DOMContentLoaded', () => {
    initializeEventListeners();
    updateStatus('1', false);
    updateStatus('2', false);
  });


  // 메시지 표시
  function displayMessage(userNum, message, currentUserId) {
    const messagesDiv = document.getElementById(`messages${userNum}`);
    const messageDiv = document.createElement('div');

    if (message.type === 'ENTER' || message.type === 'LEAVE') {
      messageDiv.className = 'system-message';
      messageDiv.textContent = message.message || `${message.senderName}님이 ${message.type === 'ENTER' ? '입장' : '퇴장'}했습니다.`;
    } else {
      const isMine = message.senderId === currentUserId;
      messageDiv.className = isMine ? 'message mine' : 'message other';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      if (!isMine) {
        const senderDiv = document.createElement('div');
        senderDiv.className = 'message-sender';
        senderDiv.textContent = message.senderName;
        contentDiv.appendChild(senderDiv);
      }

      const textDiv = document.createElement('div');
      textDiv.textContent = message.message;
      contentDiv.appendChild(textDiv);

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      timeDiv.textContent = new Date().toLocaleTimeString();
      contentDiv.appendChild(timeDiv);

      messageDiv.appendChild(contentDiv);
    }

    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

</script>
</body>
</html>
